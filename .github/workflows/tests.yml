name: tests

# Runs the offline suite only. Nothing here touches givenchybeauty.com or
# 2captcha.com — GitHub Actions has no key, and a CI job that hits a live
# site fails for reasons that have nothing to do with the commit. The live
# side is canary.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor pyproject.toml and the README claim. Claiming it
        # without testing it is how a walrus operator or a `X | None`
        # annotation ships and breaks it.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile everything
        # Catches a syntax error on the oldest supported Python before the
        # suite gets a chance to skip the file.
        run: python -m compileall -q .

      - name: Offline test suite
        # Prints its own count. No network, no key, ~1s.
        run: python smoke_test.py

      - name: Offline test suite, via pytest
        # tests/test_smoke.py wraps the same run above for the pytest entry
        # point pyproject.toml declares — this step exists so THAT wrapper
        # can't silently rot even though the line above already covers the
        # actual checks.
        run: |
          pip install pytest
          pytest -q

      - name: Every CLI answers --help
        # THIS RUNS THE SHIPPED CHECK, not a copy of it — same rule as the two
        # steps below. The inlined version this replaced covered seven
        # entry points; `ci_checks.py --help-check` covers those plus
        # tools/browser_profile_client.py, and it is the one a contributor
        # can run locally before pushing.
        #
        # A crash in argparse setup or a bad local import is invisible to the
        # test suite but breaks the first thing any user types. The engine
        # libraries are deliberately NOT installed in this job, so the check
        # reports those entry points as skipped rather than failed.
        run: python3 .github/ci_checks.py --help-check

      - name: Committed sample output is real
        # THIS RUNS THE SHIPPED CHECK, not a copy of it — the same rule the
        # "No credentials committed" step below states. This step used to
        # carry its own inlined copy, which still imported `Player` and
        # `Transfer` after the row schema became a single `Product`: the
        # shipped check was green and the workflow was red, on the same
        # repo, in the same push. Two sources of truth is exactly how that
        # happens.
        #
        # What it asserts: the two files the README links to exist, carry no
        # fabrication markers, and have the column set the writers actually
        # produce — so renaming a field without regenerating the sample
        # fails here rather than teaching readers a field name that is gone.
        run: python3 .github/ci_checks.py --sample-check

      - name: Config reporter runs with no .env present
        run: python env_config.py

      - name: No credentials committed
        # A key pasted into a file during debugging is the one mistake in this
        # repo that cannot be undone by a later commit.
        #
        # THIS RUNS THE SHIPPED CHECK, not a copy of it. A previous member of
        # this family (mediamarkt-scraper) once had an inline grep here with
        # its own allowlist that disagreed with the shipped
        # `.github/ci_checks.py` — narrower, and invoked by nothing at all.
        # Two sources of truth is how that happened; this repo only has one.
        run: python3 .github/ci_checks.py --secret-check

  engine-smoke:
    # The offline job above installs NO engine library on purpose (that is what
    # makes it offline), so every engine-guarded check in smoke_test.py skips
    # in it — and "skipped, engine absent" reads exactly like a passing run.
    # This job makes those checks actually execute.
    #
    # ONE VENV PER ENGINE, and not `pip install playwright pyppeteer selenium`
    # into one environment. Two reasons, and the second is why it matters:
    #
    #   * The three engines' pins are mutually unsatisfiable (playwright wants
    #     pyee>=13, pyppeteer wants pyee<12; pyppeteer wants urllib3<2,
    #     selenium wants >=2.6), which is exactly what the README tells users,
    #     so a venv each is also what a user actually does.
    #   * Installed together and UNPINNED, pip can resolve the conflict by
    #     reaching for a pyppeteer release nobody uses instead of the one
    #     requirements-puppeteer.txt asks for, and CI would go green against a
    #     version the repo does not support. Installing from the requirements
    #     files, separately, tests the versions users actually get.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [playwright, puppeteer, selenium]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + the ${{ matrix.engine }} engine, in its own venv
        # No browser binaries: the offline suite imports these libraries and
        # never launches one.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt \
                                -r requirements-${{ matrix.engine }}.txt
          echo "--- what actually got installed ---"
          .venv/bin/pip list --format=freeze | grep -iE '^(playwright|pyppeteer|selenium|pyee|urllib3|beautifulsoup4)='

      - name: The requirements file is self-consistent
        # Passes here precisely BECAUSE each engine has its own venv. Run in a
        # shared one it would report the three-way conflict above, which is the
        # thing this layout exists to avoid.
        run: .venv/bin/pip check

      - name: Offline suite, with ${{ matrix.engine }} actually importable
        # The suite names each engine it could not import. In this job that
        # engine IS installed, so naming it means a real import error rather
        # than an expected absence — the other two engines are absent here by
        # design and their skips are fine.
        run: |
          set -o pipefail
          .venv/bin/python smoke_test.py | tee smoke.log
          if grep -q "${{ matrix.engine }}_scraper could not be imported" smoke.log; then
            echo "FAILED: ${{ matrix.engine }}_scraper failed to import even though"
            echo "        ${{ matrix.engine }} is installed in this job."
            exit 1
          fi

      - name: The ${{ matrix.engine }} CLI answers --help
        run: .venv/bin/python ${{ matrix.engine }}_scraper.py --help >/dev/null

  # The Dockerfile ships a runnable image, and smoke_test.py's own
  # test_dockerfile_copies_what_it_runs checks its COPY list against the
  # entrypoint's import graph without needing Docker — but it cannot catch
  # the one step only a real build proves: `playwright install --with-deps
  # chromium` pulling Chromium's shared libraries into python:3.12-slim. A
  # sibling in this family (mediamarkt-scraper) shipped a Dockerfile missing
  # proxy_pool.py from its COPY list for three releases before anyone built
  # the image in CI; this job exists so that cannot happen quietly here.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # Plain `docker build`, no registry and no push: the point is that the
        # Dockerfile still builds, not that anything is published.
        run: docker build -t givenchy-scraper:ci .

      - name: The entrypoint runs inside the image
        # Its CMD is --help, so a bare `run` exercises the default path. This
        # is the invocation a missing COPY line fails on.
        run: docker run --rm givenchy-scraper:ci

      - name: Chromium is actually installed in the image
        # `playwright install` is the step this job exists to prove, so check
        # the browser is there rather than trusting that the layer succeeded.
        run: |
          docker run --rm --entrypoint python3 givenchy-scraper:ci -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print('chromium', b.version)
              b.close()"

      - name: The image carries no credentials and no test material
        # It COPYs an explicit list precisely so that it does not. Verify
        # rather than assume: a `.env` baked into an image is a credential
        # published to everyone who can pull it.
        run: |
          set -e
          missing=0
          for f in .env smoke_test.py tests sample_output.json; do
            if docker run --rm --entrypoint sh givenchy-scraper:ci -c "test -e /app/$f"; then
              echo "::error::$f is inside the image and should not be"
              missing=1
            fi
          done
          test "$missing" = "0"
          echo "no .env, no test suite, no fixtures in the image"
