name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    # Skipped, not failed, when the token is absent. Set the secret to turn
    # this on:
    #     gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo 2scraper/givenchy-scraper
    # `secrets` is not available in a job-level `if`, so the presence test goes
    # through env and is read by the step.
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Installed here, from the STABLE channel, instead of letting the action
      # fetch `latest` for itself. A sibling in this family (mediamarkt-scraper)
      # hit a `latest` release whose native install left no binary where the
      # action looks, which killed the plugin form and the plain-prompt form
      # alike. `stable` is upstream's own known-good pointer, so this pins away
      # from a bad release WITHOUT hardcoding a version: when upstream promotes
      # a newer stable, this picks it up with no edit here.
      - name: Install Claude Code (stable channel)
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          "$HOME/.local/bin/claude" --version
          # Through GITHUB_ENV, not `${{ env.HOME }}`: HOME is a runner
          # variable and is not in the workflow `env` context, so the
          # expression form expands to an empty string and the action falls
          # back to installing `latest` — the very thing this step exists to
          # avoid, and silently.
          echo "CLAUDE_BIN=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

      - name: Run Claude Code Review
        id: claude-review
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ env.CLAUDE_BIN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A plain prompt, not the plugin form — no plugin marketplace
          # install to depend on, and it is the more honest instruction to
          # give a reviewer of THIS repo: the things worth catching here are
          # measurements that drifted from what the code does, not style.
          prompt: |
            Review this pull request.

            This repository is a scraper, and its README, CHANGELOG and
            comments quote MEASURED numbers — row counts per page, price
            coverage, pagination behaviour, timings. The most valuable thing
            you can find is a number or a claim that no longer matches the
            code, or a comment that explains a reason the code no longer has.

            A few things specific to this repo worth checking: every price is
            in EUR and every row is a DOM reading (there is no JSON-LD on
            this site to cross-check against — see output_writer.py and
            diff_runs.py); there are two row schemas, Player and Transfer
            (output_writer.py), and a change to one should not silently affect
            the other; `page` and `row_index` must stay unique across a
            paginated run (see product_parser.py and the tokopedia lesson in
            CLAUDE.md); and this site's listing pagination is robots-DISALLOWED,
            so product_parser.page_url() returning its input unchanged is a
            deliberate decision, not a stub — a change that makes it
            construct a URL deserves extra scrutiny.

            Also worth flagging: a check that cannot fail, an error path that
            swallows a failure silently, a credential that could reach a
            command line or a log, and any place that presents a guess as a
            fact (a defaulted currency, a fabricated sample, an unmeasured
            claim stated plainly).

            Leave inline comments on specific lines where you can. Be brief,
            and say nothing if you find nothing.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
